name: Python Application Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        pip install -r Car_Price_Prediction/requirements.txt
        pip install -r Email_Spam_Detection/requirements.txt
        pip install -r Sales_Prediction/requirements.txt
